# Windows CI pipeline for cloudflared
# Handles building and packaging cloudflared for Windows targets

.windows-defaults: &windows-defaults
  tags:
    - windows
  before_script:
    - $env:PATH = "C:\Go\bin;" + $env:PATH
    - go version
    - go env

.windows-build-defaults: &windows-build-defaults
  <<: *windows-defaults
  stage: build
  script:
    - |
      $env:GOOS = "windows"
      $env:GOARCH = $ARCH
      $env:CGO_ENABLED = "0"
      $VERSION = (git describe --tags --always --dirty 2>$null)
      if (-not $VERSION) { $VERSION = "dev" }
      $BUILD_TIME = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
      $LDFLAGS = "-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME -s -w"
      Write-Host "Building cloudflared for windows/$env:GOARCH version $VERSION"
      go build -ldflags $LDFLAGS -o "cloudflared-windows-$env:GOARCH.exe" ./cmd/cloudflared
  artifacts:
    paths:
      - "cloudflared-windows-*.exe"
    expire_in: 1 week

build:windows:amd64:
  <<: *windows-build-defaults
  variables:
    ARCH: amd64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

build:windows:386:
  <<: *windows-build-defaults
  variables:
    ARCH: "386"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test:windows:amd64:
  <<: *windows-defaults
  stage: test
  needs:
    - build:windows:amd64
  variables:
    ARCH: amd64
  script:
    - |
      $env:CGO_ENABLED = "0"
      Write-Host "Running unit tests for windows/amd64"
      go test -v -count=1 -timeout 5m ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:windows:msi:
  <<: *windows-defaults
  stage: package
  needs:
    - build:windows:amd64
  script:
    - |
      Write-Host "Packaging cloudflared MSI installer"
      # Requires WiX toolset installed on the runner
      if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
        Write-Warning "WiX toolset not found, skipping MSI packaging"
        exit 0
      }
      $VERSION = (git describe --tags --always --dirty 2>$null)
      if (-not $VERSION) { $VERSION = "0.0.0" }
      # Strip leading 'v' from version if present
      $VERSION = $VERSION.TrimStart('v')
      candle.exe -dVersion=$VERSION -dBinaryPath="cloudflared-windows-amd64.exe" packaging/windows/cloudflared.wxs
      light.exe -o "cloudflared-$VERSION-amd64.msi" cloudflared.wixobj
  artifacts:
    paths:
      - "cloudflared-*.msi"
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'

sign:windows:
  <<: *windows-defaults
  stage: sign
  needs:
    - package:windows:msi
  script:
    - |
      Write-Host "Signing cloudflared MSI"
      if (-not $env:WINDOWS_SIGNING_CERT) {
        Write-Warning "No signing certificate configured, skipping signing"
        exit 0
      }
      $MSI = Get-Item "cloudflared-*.msi" | Select-Object -First 1
      signtool.exe sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:WINDOWS_SIGNING_CERT $MSI.Name
  artifacts:
    paths:
      - "cloudflared-*.msi"
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
